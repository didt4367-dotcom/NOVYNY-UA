<script>


const form =
    document.getElementById("newsForm");


const newsList =
    document.getElementById("newsList");


const success =
    document.getElementById("success");


const formPanel =
    document.getElementById("formPanel");


const formTitle =
    document.getElementById("formTitle");


const submitButton =
    document.getElementById("submitButton");


const cancelButton =
    document.getElementById("cancelButton");


const currentPhoto =
    document.getElementById("currentPhoto");


const searchInput =
    document.getElementById("searchInput");


const filterCategory =
    document.getElementById(
        "filterCategory"
    );


let editingId = null;

let allNews = [];



// =======================================
// ВИХІД
// =======================================

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function () {

            try {

                const response =
                    await fetch(
                        "/api/logout",
                        {
                            method: "POST"
                        }
                    );


                if (response.ok) {

                    window.location.href =
                        "/login.html";

                }

                else {

                    alert(
                        "Не вдалося вийти"
                    );

                }

            }

            catch (error) {

                console.error(error);

                alert(
                    "Не вдалося з'єднатися із сервером"
                );

            }

        }
    );



// =======================================
// СТАТИСТИКА
// =======================================

function updateStats() {

    document
        .getElementById("totalNews")
        .textContent =
        allNews.length;


    const featured =
        allNews.filter(
            item =>
                Number(item.featured) === 1
        ).length;


    document
        .getElementById("featuredNews")
        .textContent =
        featured;


    const withPhoto =
        allNews.filter(
            item =>
                item.image
        ).length;


    document
        .getElementById("photoNews")
        .textContent =
        withPhoto;

}



// =======================================
// ЗАВАНТАЖИТИ НОВИНИ
// =======================================

async function loadNews() {

    try {

        const response =
            await fetch("/api/news");


        if (
            response.status === 401
        ) {

            window.location.href =
                "/login.html";

            return;

        }


        allNews =
            await response.json();


        updateStats();

        renderNews();

    }

    catch (error) {

        console.error(error);

        newsList.innerHTML = `

            <div class="empty">

                Не вдалося завантажити новини.

            </div>

        `;

    }

}



// =======================================
// ПОКАЗ СПИСКУ
// =======================================

function renderNews() {


    const searchText =
        searchInput.value
            .toLowerCase()
            .trim();


    const category =
        filterCategory.value;


    const filtered =
        allNews.filter(item => {


            const matchesSearch =

                !searchText

                ||

                item.title
                    .toLowerCase()
                    .includes(
                        searchText
                    )

                ||

                item.text
                    .toLowerCase()
                    .includes(
                        searchText
                    )

                ||

                item.category
                    .toLowerCase()
                    .includes(
                        searchText
                    );


            const matchesCategory =

                category === "all"

                ||

                item.category ===
                    category;


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    newsCount.textContent =
        `Показано ${filtered.length} з ${allNews.length} новин`;


    newsList.innerHTML = "";


    if (
        filtered.length === 0
    ) {

        newsList.innerHTML = `

            <div class="empty">

                🔎 Новин не знайдено.

            </div>

        `;

        return;

    }


    filtered.forEach(item => {


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "news-item";


        const photo =
            item.image

                ? `

                    <img
                        class="news-photo"
                        src="${item.image}"
                        alt="">

                  `

                : `

                    <div
                        class="news-photo">
                    </div>

                  `;


        const featuredButton =
            Number(item.featured) === 1

                ? `

                    <button
                        class="unfeatured"
                        data-featured-id="${item.id}">

                        ⭐ ГОЛОВНА

                    </button>

                  `

                : `

                    <button
                        class="featured"
                        data-featured-id="${item.id}">

                        ⭐ Зробити головною

                    </button>

                  `;


        const featuredLabel =
            Number(item.featured) === 1

                ? `

                    <div class="featured-label">

                        ⭐ Ця новина головна

                    </div>

                  `

                : "";


        element.innerHTML = `

            ${photo}


            <div class="news-info">

                <h3>
                    ${item.title}
                </h3>

                <span>
                    ${item.category}
                    ·
                    ${item.created_at}
                </span>

                ${featuredLabel}

                <p>
                    ${item.text}
                </p>

            </div>


            <div class="actions">

                ${featuredButton}


                <button
                    class="edit"
                    data-id="${item.id}">

                    ✏️ Редагувати

                </button>


                <button
                    class="delete"
                    data-id="${item.id}">

                    🗑️ Видалити

                </button>

            </div>

        `;


        newsList.appendChild(
            element
        );

    });

}



// =======================================
// ЗРОБИТИ ГОЛОВНОЮ
// =======================================

async function makeFeatured(id) {

    try {

        const response =
            await fetch(
                `/api/news/${id}/featured`,
                {
                    method: "PUT"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.error ||
                "Не вдалося зробити новину головною"
            );

            return;

        }


        showSuccess(
            "⭐ Головну новину змінено!"
        );


        loadNews();

    }

    catch (error) {

        console.error(error);

        alert(
            "Помилка з'єднання із сервером"
        );

    }

}



// =======================================
// ПРИБРАТИ ГОЛОВНУ
// =======================================

async function removeFeatured(id) {

    try {

        const response =
            await fetch(
                `/api/news/${id}/featured`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.error ||
                "Помилка"
            );

            return;

        }


        showSuccess(
            "Головну новину прибрано"
        );


        loadNews();

    }

    catch (error) {

        console.error(error);

        alert(
            "Помилка з'єднання із сервером"
        );

    }

}



// =======================================
// ОЧИСТИТИ ФОРМУ
// =======================================

function resetForm() {

    editingId = null;

    form.reset();

    currentPhoto.innerHTML = "";

    formPanel.classList.remove(
        "editing"
    );

    formTitle.textContent =
        "➕ Додати новину";

    submitButton.textContent =
        "Опублікувати новину";

    cancelButton.style.display =
        "none";

}



// =======================================
// РЕДАГУВАННЯ
// =======================================

async function editNews(id) {

    try {

        const item =
            allNews.find(
                n =>
                    String(n.id) ===
                    String(id)
            );


        if (!item) {

            alert(
                "Новину не знайдено"
            );

            return;

        }


        editingId =
            item.id;


        document
            .getElementById("title")
            .value =
            item.title;


        document
            .getElementById("category")
            .value =
            item.category;


        document
            .getElementById("text")
            .value =
            item.text;


        document
            .getElementById("image")
            .value =
            "";


        if (item.image) {

            currentPhoto.innerHTML = `

                <p style="
                    font-size:13px;
                    color:#667085;
                    margin-bottom:8px;
                ">

                    Поточна фотографія:

                </p>


                <img
                    src="${item.image}"
                    alt="Поточне фото">

                <p style="
                    font-size:12px;
                    color:#98a2b3;
                    margin-top:6px;
                ">

                    Якщо вибереш нове фото,
                    воно замінить це.

                </p>

            `;

        }

        else {

            currentPhoto.innerHTML = "";

        }


        formPanel.classList.add(
            "editing"
        );


        formTitle.textContent =
            "✏️ Редагування новини";


        submitButton.textContent =
            "Зберегти зміни";


        cancelButton.style.display =
            "inline-block";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }

    catch (error) {

        console.error(error);

        alert(
            "Помилка завантаження новини"
        );

    }

}



// =======================================
// ВІДПРАВКА ФОРМИ
// =======================================

form.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const formData =
            new FormData();


        formData.append(
            "title",
            document
                .getElementById("title")
                .value
        );


        formData.append(
            "category",
            document
                .getElementById("category")
                .value
        );


        formData.append(
            "text",
            document
                .getElementById("text")
                .value
        );


        const image =
            document
                .getElementById("image")
                .files[0];


        if (image) {

            formData.append(
                "image",
                image
            );

        }


        try {

            let response;


            if (
                editingId === null
            ) {

                response =
                    await fetch(
                        "/api/news",
                        {
                            method: "POST",
                            body: formData
                        }
                    );

            }

            else {

                response =
                    await fetch(
                        `/api/news/${editingId}`,
                        {
                            method: "PUT",
                            body: formData
                        }
                    );

            }


            if (
                response.status === 401
            ) {

                window.location.href =
                    "/login.html";

                return;

            }


            const result =
                await response.json();


            if (!response.ok) {

                alert(
                    result.error ||
                    "Сталася помилка"
                );

                return;

            }


            showSuccess(
                editingId === null
                    ? "✅ Новину опубліковано!"
                    : "✅ Зміни збережено!"
            );


            resetForm();

            loadNews();

        }

        catch (error) {

            console.error(error);

            alert(
                "Помилка з'єднання із сервером"
            );

        }

    }
);



// =======================================
// УСПІШНЕ ПОВІДОМЛЕННЯ
// =======================================

function showSuccess(message) {

    success.textContent =
        message;

    success.style.display =
        "block";


    setTimeout(
        () => {

            success.style.display =
                "none";

        },
        3000
    );

}



// =======================================
// СКАСУВАТИ РЕДАГУВАННЯ
// =======================================

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

    }
);



// =======================================
// ПОШУК

searchInput.addEventListener(
    "input",
    function() {

        renderNews();

    }
);



// =======================================
// ФІЛЬТР
// =======================================

filterCategory.addEventListener(
    "change",
    function() {

        renderNews();

    }
);



// =======================================
// КНОПКИ НОВИН
// =======================================

newsList.addEventListener(
    "click",
    async function(event) {


        const button =
            event.target;


        const id =
            button.dataset.id;


        const featuredId =
            button.dataset.featuredId;


        if (
            featuredId
        ) {

            if (
                button.classList
                    .contains("unfeatured")
            ) {

                await removeFeatured(
                    featuredId
                );

            }

            else {

                await makeFeatured(
                    featuredId
                );

            }

            return;

        }


        if (
            button.classList
                .contains("edit")
        ) {

            editNews(id);

            return;

        }


        if (
            button.classList
                .contains("delete")
        ) {


            if (
                !confirm(
                    "Ви точно хочете видалити цю новину?"
                )
            ) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/news/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "/login.html";

                    return;

                }


                const result =
                    await response.json();


                if (!response.ok) {

                    alert(
                        result.error ||
                        "Помилка видалення"
                    );

                    return;

                }


                showSuccess(
                    "🗑️ Новину видалено!"
                );


                loadNews();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Помилка з'єднання із сервером"
                );

            }

        }

    }
);



// =======================================
// ЗАПУСК
// =======================================

loadNews();


</script>
